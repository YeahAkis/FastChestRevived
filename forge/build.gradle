plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.40,8)'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = mod_version
group = 'org.notionsmp'

base {
    archivesName = 'fastchestrevived-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/${it.name}")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            args '--mixin.config', 'fastchestrevived.mixins.json'
        }

        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

processResources {
    def props = [version: version, minecraft_range: minecraft_range, loader_range: loader_range]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from '../LICENSE.txt'
    manifest {
        attributes 'MixinConfigs': 'fastchestrevived.mixins.json'
    }
}

apply from: '../publish.gradle'
