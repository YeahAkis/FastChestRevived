plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = 'org.notionsmp'

base {
    archivesName = 'fastchestrevived-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(16)

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                fastchestrevived {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'fastchestrevived.refmap.json'
    config 'fastchestrevived.mixins.json'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def props = [version: version, minecraft_range: minecraft_range, loader_range: loader_range]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
    filesMatching('fastchestrevived.mixins.json') {
        filter { line -> line.contains('"package"') ? line + '\n  "refmap": "fastchestrevived.refmap.json",' : line }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from '../LICENSE.txt'
    finalizedBy 'reobfJar'
}
